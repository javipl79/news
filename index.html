<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Pulso · Archivo Cripto</title>
<!-- PWA: permite instalar Pulso en el teléfono -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#080c0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Pulso" />
<link rel="apple-touch-icon" href="pulso-ico-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="pulso-ico-192.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@300;400;500;600;700;800&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #080c0a; }
  body { font-family: 'Barlow Semi Condensed', sans-serif; color: #d8e6e0; -webkit-text-size-adjust: 100%; }
  /* El contenedor ocupa toda la altura de la caja del iframe (Wix "Embed a Site")
     y scrollea por dentro. Sin -webkit-overflow-scrolling: touch porque en iOS
     congela el scroll cuando el contenido cambia de alto (al desplegar una noticia). */
  /* Altura de la caja del iframe (Wix, ~700px). El #app scrollea por dentro.
     Colchón inferior generoso para que el botón "Cargar más" quede con aire y se vea
     completo al scrollear hasta el final (sin quedar pegado al borde). */
  #app { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 160px; }
  #list { }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #1f2d28; border-radius: 4px; }

  header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; padding-top: calc(14px + env(safe-area-inset-top)); border-bottom: 1px solid #16221d; flex-wrap: wrap; gap: 10px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { height: 38px; width: auto; display: block; }
  .live { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #00ff00; letter-spacing: 1px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff00; animation: pulse 1.5s infinite; }
  .live-wrap { display: flex; align-items: center; gap: 8px; }
  .logo-pulso { height: 24px; width: auto; display: block; }
  .version { font-size: 11px; color: #888; letter-spacing: .5px; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .updated { font-size: 12px; color: #5a6b64; display: flex; align-items: center; gap: 10px; }
  .env-sub { color: #9bb5ac; font-size: 13px; }
.btn-refrescar { background: transparent; border: 1px solid #1f2d28; color: #9bb5ac; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; transition: color .2s, border-color .2s; }
.btn-refrescar svg { display: block; }
.btn-refrescar:active { color: #00ff00; border-color: #00ff00; }
.btn-refrescar.girando svg { animation: gira-ref .6s ease; }
@keyframes gira-ref { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  .toolbar { display: flex; gap: 10px; padding: 12px 20px; align-items: center; border-bottom: 1px solid #16221d; flex-wrap: wrap; justify-content: flex-start; }
  .search { flex: 0 1 320px; min-width: 180px; background: #0f1714; border: 1px solid #1f2d28; color: #d8e6e0; padding: 8px 12px; border-radius: 6px; font-family: inherit; font-size: 15px; outline: none; }
  select { flex: 0 0 auto; min-width: 110px; background: #0f1714; border: 1px solid #1f2d28; color: #d8e6e0; padding: 8px 12px; border-radius: 6px; font-family: inherit; font-size: 14px; outline: none; cursor: pointer; }
  .filter-btn { background: transparent; border: 1px solid #1f2d28; color: #9bb5ac; padding: 8px 12px; border-radius: 6px; font-family: inherit; font-size: 14px; cursor: pointer; white-space: nowrap; }
  .filter-btn.on { border-color: #ff6b35; color: #ff6b35; background: #1a0d08; }
  /* Chips de filtros activos (con ✕ para limpiar) */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px; }
  .chips:not(:empty) { padding-top: 10px; padding-bottom: 10px; border-bottom: 1px solid #16221d; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: #16221d; color: #9bd4c0; border: 1px solid #1f2d28; padding: 4px 10px; border-radius: 14px; font-size: 13px; cursor: pointer; }
  .chip:hover { border-color: #00ff00; color: #00ff00; }
  .chip-x { font-size: 11px; opacity: .7; }
  .chip:hover .chip-x { opacity: 1; }

  .list { }
  .empty { padding: 30px; color: #5a6b64; font-size: 15px; text-align: center; }

  .news-row { position: relative; background: #0a0a0a; border: 1px solid transparent; border-radius: 8px; overflow: hidden; color: #d8e6e0; margin: 1px 10px; transition: background .6s ease; }
  /* Franja de vejez: capa sólida a la izquierda (sin gradiente). Su ancho = frescura. */
  .franja { position: absolute; top: 0; left: 0; bottom: 0; z-index: 0; transform-origin: left center; }
  .franja.anim { animation: franja-carga .9s cubic-bezier(.22,.61,.36,1) both; }
  @keyframes franja-carga { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  /* El contenido va por encima de la franja */
  .news-row-main, .news-panel { position: relative; z-index: 1; }
  @media (prefers-reduced-motion: reduce) { .franja.anim { animation: none; } }
  /* Escalonado: cada franja entra un poco después que la de arriba */
  .news-row:nth-child(1) .franja.anim { animation-delay: 0s; }
  .news-row:nth-child(2) .franja.anim { animation-delay: .09s; }
  .news-row:nth-child(3) .franja.anim { animation-delay: .18s; }
  .news-row:nth-child(4) .franja.anim { animation-delay: .27s; }
  .news-row:nth-child(5) .franja.anim { animation-delay: .36s; }
  .news-row:nth-child(6) .franja.anim { animation-delay: .45s; }
  .news-row:nth-child(7) .franja.anim { animation-delay: .54s; }
  .news-row:nth-child(8) .franja.anim { animation-delay: .63s; }
  /* Entrada de noticias nuevas: aparecen con un destello verde que se desvanece */
  .news-row.nueva { animation: entra-nueva .9s ease both; }
  @keyframes entra-nueva {
    0%   { opacity: 0; transform: translateY(-12px); box-shadow: inset 0 0 0 9999px rgba(0,255,0,.12); }
    60%  { opacity: 1; transform: translateY(0); box-shadow: inset 0 0 0 9999px rgba(0,255,0,.06); }
    100% { box-shadow: inset 0 0 0 9999px rgba(0,255,0,0); }
  }
  .hot-mode .news-row.nueva { animation: entra-nueva-hot .9s ease both; }
  @keyframes entra-nueva-hot {
    0%   { opacity: 0; transform: translateY(-12px); box-shadow: inset 0 0 0 9999px rgba(255,107,53,.15); }
    60%  { opacity: 1; transform: translateY(0); box-shadow: inset 0 0 0 9999px rgba(255,107,53,.08); }
    100% { box-shadow: inset 0 0 0 9999px rgba(255,107,53,0); }
  }
  @media (prefers-reduced-motion: reduce) { .news-row.nueva { animation: none; } }
  .news-row-main { display: flex; align-items: flex-start; gap: 12px; padding: 18px 22px; cursor: pointer; -webkit-user-select: none; user-select: none; }
  /* Ícono de sentimiento (toro/oso) al principio de cada noticia. Altura fija, ancho automático para no deformar. */
  .ico-sent { height: 30px; width: auto; flex-shrink: 0; object-fit: contain; align-self: flex-start; margin-top: 3px; image-rendering: -webkit-optimize-contrast; }
  .news-row.open { border-color: #00ff0055; }
  .news-row.open .news-row-main { padding-bottom: 14px; }
  .rank { font-size: 13px; color: #5a6b64; min-width: 22px; text-align: right; }
  .rank.hot { color: #00ff00; font-weight: 700; }
  .row-head { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; flex-wrap: wrap; }
  .row-src { font-size: 12px; color: #00ff00; text-transform: uppercase; letter-spacing: 1px; }
  .row-time { font-size: 12px; color: #5a6b64; }
  .hot-tag { font-size: 12px; color: #ff6b35; font-weight: 600; }
  .evento-tag { font-size: 12px; color: #5cc8ff; background: #0d1a26; padding: 1px 7px; border-radius: 3px; }
  .row-coin { font-size: 12px; background: #16221d; color: #9bb5ac; padding: 1px 5px; border-radius: 3px; }
  .row-tema { font-size: 12px; background: #1a1410; color: #ff9d5c; padding: 1px 7px; border-radius: 3px; }
  .tema-click { cursor: pointer; }
  @media (hover: hover) { .tema-click:hover { background: #2a1f14; color: #ffb877; } }
  .news-title { font-size: 17px; line-height: 1.4; color: #d8e6e0; font-weight: 500; transition: color .2s ease; }
  .row-open { flex-shrink: 0; align-self: center; color: #5a6b64; font-size: 19px; }
  .ico-go { height: 21px; width: auto; display: block; opacity: .85; transition: opacity .2s; }
  .ico-go-sm { height: 11px; width: auto; vertical-align: baseline; margin-left: 8px; position: relative; top: 1px; }
  .load-more { display: block; width: calc(100% - 36px); margin: 16px 18px 24px; padding: 14px; background: transparent; border: 1px solid #1f2d28; color: #9bb5ac; border-radius: 8px; font-family: inherit; font-size: 15px; cursor: pointer; transition: border-color .2s, color .2s; }
  .news-panel { padding: 16px 22px 22px 22px; }
  .news-resumen { font-size: 15px; line-height: 1.6; color: #c8d6d0; margin: 0 0 22px 0; }
  /* Key points (3 ideas clave) */
  .news-puntos { list-style: none; margin: 0 0 18px 0; padding: 0; }
  .news-puntos li { position: relative; padding-left: 20px; margin-bottom: 9px; font-size: 14px; line-height: 1.45; color: #b8ccc4; }
  .news-puntos li::before { content: "▸"; position: absolute; left: 0; color: #00ff00; font-size: 13px; }
  .hot-mode .news-puntos li::before { color: #ff6b35; }
  .news-orig { font-size: 13px; line-height: 1.5; color: #6b7d76; margin: 0 0 22px 0; font-style: italic; }
  .read-btn { display: inline-flex; align-items: center; background: #0d1f18; border: 1px solid #00ff00; color: #00ff00; padding: 11px 18px; border-radius: 6px; font-family: inherit; font-size: 14px; text-decoration: none; }
  /* Botón leer en modo caliente: colores de fuego */
  .read-btn.hot { background: #1f0f08; border-color: #ff6b35; color: #ff6b35; }
  @keyframes slidein { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

  /* ── Modo "Calientes" activo: paleta brasa (rojo/naranja) + entrada animada ── */
  /* Fondo cálido en las filas */
  .hot-mode .news-row { background: #1a0d08; }
  .hot-mode .news-row.alt { background: #1f0f08; }
  .hot-mode .news-row.open { border-color: #ff6b3555; }
  /* Acentos en tonos fuego */
  .hot-mode .row-src { color: #ff8c42; }
  .hot-mode .rank.hot { color: #ff6b35; }
  .hot-mode .news-title { color: #ffd9c2; }
  .hot-mode .row-coin { background: #2a1208; color: #ffb38a; }
  /* Borde izquierdo tipo brasa que LATE suave (brasa viva) */
  @keyframes brasa { 0%,100% { box-shadow: inset 3px 0 0 #ff6b35; } 50% { box-shadow: inset 3px 0 0 #ff3d00, -1px 0 8px #ff3d0055; } }
  .hot-mode .news-row { box-shadow: inset 3px 0 0 #ff6b35; }
  /* Entrada animada: cada fila aparece con un fade+subida suave.
     Solo de entrada (no continua), para no trabar el scroll en mobile. */
  @keyframes hotin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .hot-mode .news-row { animation: hotin .28s ease both, brasa 2.4s ease-in-out infinite; }
  /* Escalonado: las primeras filas entran una tras otra para dar sensación de "encendido" */
  .hot-mode .news-row:nth-child(1) { animation-delay: 0s; }
  .hot-mode .news-row:nth-child(2) { animation-delay: .04s; }
  .hot-mode .news-row:nth-child(3) { animation-delay: .08s; }
  .hot-mode .news-row:nth-child(4) { animation-delay: .12s; }
  .hot-mode .news-row:nth-child(5) { animation-delay: .16s; }
  .hot-mode .news-row:nth-child(6) { animation-delay: .20s; }
  /* Respeta a quien prefiere menos movimiento */
  @media (prefers-reduced-motion: reduce) {
    .hot-mode .news-row { animation: none; }
    .flama { animation: none; }
  }
  /* Llama animada: oscila suave (titila como fuego). Inline-block para poder transformar. */
  .flama { display: inline-block; transform-origin: 50% 90%; animation: flamea 1.1s ease-in-out infinite; }
  @keyframes flamea {
    0%,100% { transform: scale(1) rotate(0deg); }
    25%     { transform: scale(1.12) rotate(-4deg); }
    50%     { transform: scale(0.96) rotate(3deg); }
    75%     { transform: scale(1.08) rotate(-2deg); }
  }
  /* Efectos hover SOLO en dispositivos con mouse real (desktop).
     En mobile el hover queda "pegado" al tocar y causa trabas en el scroll. */
  @media (hover: hover) {
    .news-row:hover { border-color: #00ff00 !important; box-shadow: inset 0 0 0 1px #00ff0033, 0 0 12px #00ff0022; }
    .news-row:hover .news-row-main { background: #222; }
    .news-row:hover .news-title { color: #00ff00; }
    .news-row:hover .ico-go { opacity: 1; }
    .load-more:hover { border-color: #00ff00; color: #00ff00; }
    .read-btn:hover { background: #00ff00; color: #080c0a; }
    /* En modo Calientes, el hover va en rojo (no verde) */
    .hot-mode .news-row:hover { border-color: #ff0000 !important; box-shadow: inset 3px 0 0 #ff6b35, 0 0 12px #ff000033; }
    .hot-mode .news-row:hover .news-row-main { background: #2a1208; }
    .hot-mode .news-row:hover .news-title { color: #ff5a3c; }
  }

  @media (max-width: 600px) {
    header { padding: 12px 14px; padding-top: calc(12px + env(safe-area-inset-top)); gap: 10px; }
    .brand { width: 100%; justify-content: space-between; }
    .logo { height: 32px; }
    .toolbar { padding: 10px 14px; gap: 8px; }
    .search { flex: 1 1 100%; min-width: 0; padding: 11px 12px; font-size: 16px; }
    select { flex: 1; min-width: 0; padding: 11px 8px; font-size: 14px; }
    .news-row-main { padding: 16px 18px; gap: 8px; }
    .ico-sent { height: 26px; width: auto; }
    .news-panel { padding: 14px 18px 20px 18px; }
    .news-orig { font-size: 13px; margin-bottom: 14px; }
    .rank { min-width: 18px; font-size: 12px; }
    .news-title { font-size: 16px; line-height: 1.35; }
    .row-head { gap: 6px; margin-bottom: 4px; }
    .row-src { font-size: 11px; }
    .row-time, .hot-tag, .row-coin, .row-tema { font-size: 11px; }
    .row-open { font-size: 17px; }
  }

  /* ── Banner de instalación ── */
  /* FIX: el atributo hidden debe ganarle a display:flex de las clases de abajo */
  .install-banner[hidden], .install-modal[hidden] { display: none !important; }
  .install-banner {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 200;
    display: flex; align-items: center; gap: 12px;
    background: #0f1714; border: 1px solid #1f8a4c;
    border-radius: 14px; padding: 12px 14px;
    box-shadow: 0 8px 30px rgba(0,0,0,.6), 0 0 16px #00ff0022;
    animation: ib-up .35s ease both;
  }
  @keyframes ib-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .ib-icon img { width: 42px; height: 42px; border-radius: 10px; display: block; }
  .ib-text { flex: 1; min-width: 0; }
  .ib-title { color: #00ff00; font-size: 15px; font-weight: 600; }
  .ib-sub { color: #9bb5ac; font-size: 13px; line-height: 1.3; }
  .ib-action {
    background: #00ff00; color: #080c0a; border: none;
    padding: 10px 18px; border-radius: 8px; font-family: inherit;
    font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  /* Botón de cerrar grande y fácil de tocar */
  .ib-close {
    background: #16221d; border: 1px solid #2a3a33; color: #d8e6e0;
    font-size: 22px; cursor: pointer; flex-shrink: 0;
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; line-height: 1;
  }
  .ib-close:active { background: #2a3a33; transform: scale(.94); }

  /* ── Popup de instrucciones (iPhone) ── */
  .install-modal {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(0,0,0,.72);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: im-fade .25s ease both;
  }
  @keyframes im-fade { from { opacity: 0; } to { opacity: 1; } }
  .im-card {
    position: relative; background: #121212;
    border-radius: 18px; padding: 32px 22px 30px; max-width: 360px; width: 100%;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.8);
  }
  /* Borde con haz de luz verde que recorre (estilo Archivo Cripto / War Room) */
  .im-card::before {
    content: ''; position: absolute; inset: 0; border-radius: 18px;
    padding: 1.5px;
    background: conic-gradient(from var(--ang, 0deg),
      transparent 0deg, transparent 70deg,
      #00ff00 100deg, transparent 150deg, transparent 360deg);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    animation: im-rotaBorde 4s linear infinite; pointer-events: none;
  }
  @property --ang { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes im-rotaBorde { to { --ang: 360deg; } }
  .im-close {
    position: absolute; top: 12px; right: 12px;
    background: #16221d; border: 1px solid #2a3a33; color: #d8e6e0;
    width: 44px; height: 44px; border-radius: 50%; font-size: 21px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; line-height: 1;
  }
  .im-close:active { background: #2a3a33; transform: scale(.94); }
  .im-icon { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 12px; }
  .im-title { color: #00ff00; font-size: 19px; font-weight: 600; margin-bottom: 18px; }
  .im-steps { text-align: left; color: #d8e6e0; font-size: 15px; line-height: 1.5; margin: 0 0 18px 20px; padding: 0; }
  .im-steps li { margin-bottom: 12px; }
  .im-share { font-size: 18px; }
  .im-flecha { width: 29px; height: auto; display: block; margin: 4px auto 12px; animation: flecha-bota 1.1s ease-in-out infinite; }
  @keyframes flecha-bota { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
  .im-hint { color: #9bb5ac; font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <img class="logo" src="logo-archivo.png" alt="Archivo Cripto" onerror="this.style.display='none'">
      <span class="live-wrap"><span class="live"><span class="live-dot"></span> <img class="logo-pulso" src="logo-pulso.png" alt="Pulso"></span><span class="version">v9.25</span></span>
    </div>
    <div class="updated" id="updated"><span class="env-sub" id="updated-sub"></span><button id="btn-refrescar" class="btn-refrescar" aria-label="Refrescar" title="Refrescar"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button></div>
  </header>
  <div class="toolbar">
    <input id="search" class="search" placeholder="Buscar en titulares…">
    <select id="f-source" class="filtro-sel"><option value="all">Fuentes</option></select>
    <select id="f-coin" class="filtro-sel"><option value="all">Activos</option></select>
    <button id="f-multi" class="filter-btn"><span class="flama">🔥</span> Calientes</button>
  </div>
  <div id="chips" class="chips"></div>
  <div id="list" class="list"><div class="empty">Cargando noticias…</div></div>
</div>

<!-- Banner para instalar Pulso en el teléfono -->
<div id="install-banner" class="install-banner" hidden>
  <div class="ib-icon"><img src="pulso-ico-192.png" alt="Pulso"></div>
  <div class="ib-text">
    <div class="ib-title">Instalá Pulso</div>
    <div class="ib-sub" id="ib-sub">Tenelo siempre a mano en tu teléfono</div>
  </div>
  <button id="ib-action" class="ib-action">Instalar</button>
  <button id="ib-close" class="ib-close" aria-label="Cerrar">✕</button>
</div>

<!-- Popup con instrucciones para iPhone -->
<div id="install-modal" class="install-modal" hidden>
  <div class="im-card">
    <button id="im-close" class="im-close" aria-label="Cerrar">✕</button>
    <img class="im-icon" src="pulso-ico-192.png" alt="Pulso">
    <div class="im-title" id="im-title">Instalá Pulso en tu iPhone</div>
    <div id="im-content">
    <ol class="im-steps">
      <li>Tocá el botón <b style="color:#00ff00">Compartir</b> <span class="im-share">⎙</span> en la barra de abajo de Safari</li>
      <li>Deslizá y elegí <b style="color:#00ff00">“Agregar a inicio”</b></li>
      <li>Tocá <b>Agregar</b> y listo</li>
    </ol>
    <img class="im-flecha" src="ico-flecha-ios-ayuda.png" alt="">
    <div class="im-hint">El botón de Compartir (•••) está abajo a la derecha.</div>
    </div>
  </div>
</div>

<script>
// ── Archivo Cripto · Noticias en vivo ────────────────────────────────────────
// Lee el JSON ya procesado por el motor de la Mac Mini (traducido al español,
// rankeado por importancia y agrupado por tema), servido vía túnel Cloudflare.
var NEWS_URL = "https://noticias.archivocripto.app/news-data";
var COINS = ["BTC","ETH","SOL","XRP","HYPE","BNB","DOGE","ADA","AVAX","LINK"];

var items = [];
var q = "", fSource = "all", fCoin = "all", fMulti = false, fTema = null;
var expandedId = null;
var visibleCount = 30;
var verArchivo = false;     // cuando es true, también se muestran las noticias archivadas (barra ≤20%)
var UMBRAL_ARCHIVO = 20;    // noticias con frescura ≤ esto quedan detrás de "Archivo"
var pollTimer = null;
var animarFranjas = true; // anima las franjas solo al cargar/cambiar noticias, no en el refresco de reloj

function timeAgo(ts){
  var s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return s+"s";
  if(s<3600) return Math.floor(s/60)+"m";
  if(s<86400) return Math.floor(s/3600)+"h";
  return Math.floor(s/86400)+"d";
}
// Vida útil de una noticia en horas, según su importancia (urgencia).
// Muy dinámico: las flojas se enfrían en ~1h, las importantes duran hasta ~5h.
// urgencia ~0 → 1h | urgencia 50 → ~3h | urgencia 90+ → ~4.6h | tope 5h
function vidaHoras(it){
  var u = it.urgencia || 0;
  return Math.min(5, 1 + (u/100) * 4);
}
// Frescura 0–100: 100 recién salida, baja hasta ~3 al agotar su vida útil.
// Una noticia importante mantiene la barra alta más tiempo → se queda arriba.
function frescura(it){
  var horas = (Date.now() - it.ts) / 3600000;
  return Math.max(3, Math.round(100 - (horas / vidaHoras(it)) * 100));
}
// Una noticia está caliente si:
//   1) la IA por sí sola la consideró importante (score ≥ 70) — evita que una
//      gacetilla mediana se vuelva caliente solo por estar replicada en varios medios,
//   2) su urgencia total es alta (≥ 80 en la escala nueva, topeada a 100),
//   3) su barra todavía no se enfrió (frescura > 20%).
// Cuando la frescura baja del 20%, se "enfría" y pasa a ser una noticia común.
var PISO_SCORE_CALIENTE = 70;
function esCaliente(it){
  return (it.score || 0) >= PISO_SCORE_CALIENTE && (it.urgencia || 0) >= 80 && frescura(it) > 20;
}
function clip(t,n){ n=n||160; t=t||""; return t.length>n ? t.slice(0,n).trim()+"…" : t; }
function esc(s){ var d=document.createElement("div"); d.textContent=s||""; return d.innerHTML; }

function loadNews(){
  fetch(NEWS_URL, { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(data){
      var primeracarga = (items.length === 0);
      // IDs que ya teníamos, para detectar las nuevas y animarlas al entrar.
      var idsViejos = {};
      items.forEach(function(it){ idsViejos[it.id] = true; });
      items = (data.items || []).map(function(it){
        return {
          id: it.id,
          source: it.source,
          title: it.titulo_es || it.title,
          resumen: it.resumen_es || "",
          original: (it.titulo_es && it.titulo_es !== it.title) ? it.title : "",
          url: it.url,
          ts: it.ts || Date.now(),
          coins: it.coins || [],
          tema: it.tema || "",
          fuentes_tema: it.fuentes_tema || 1,
          urgencia: it.urgencia || 0,
          score: it.score || 0,
          evento_cerca: it.evento_cerca || false,
          sentimiento: it.sentimiento || "",  // "bull" | "bear" | "neutral" (lo genera el motor)
          puntos: Array.isArray(it.puntos) ? it.puntos : [],  // 3 key points (lo genera el motor)
          // Es nueva si no estaba antes (y no es la primera carga de la página).
          esNueva: !primeracarga && !idsViejos[it.id]
        };
      });
      var when = data.updatedAt ? new Date(data.updatedAt) : null;
      document.getElementById("updated-sub").textContent = when
        ? "Última actualización hace " + timeAgo(when.getTime())
        : "";
      animarFranjas = true; // llegaron noticias → animar las franjas en este render
      render();
    })
    .catch(function(){
      if(items.length === 0){
        document.getElementById("list").innerHTML =
          '<div class="empty">No se pudieron cargar las noticias en este momento.<br>Reintentando…</div>';
      }
    });
}

function updateSourceFilter(){
  var sel = document.getElementById("f-source");
  var present = {};
  items.forEach(function(it){ present[it.source]=true; });
  var cur = sel.value;
  var opts = '<option value="all">Fuentes</option>';
  Object.keys(present).sort().forEach(function(s){ opts += '<option value="'+esc(s)+'">'+esc(s)+'</option>'; });
  sel.innerHTML = opts;
  sel.value = cur;
}

// Muestra chips de los filtros activos, cada uno con ✕ para limpiarlo.
function renderChips(){
  var cont = document.getElementById("chips");
  if(!cont) return;
  var chips = [];
  if(fSource !== "all") chips.push({tipo:"source", txt: fSource});
  if(fCoin !== "all") chips.push({tipo:"coin", txt: fCoin});
  if(fTema) chips.push({tipo:"tema", txt: fTema});
  if(fMulti) chips.push({tipo:"hot", txt: "🔥 Calientes"});
  if(q) chips.push({tipo:"q", txt: '"'+q+'"'});
  cont.innerHTML = chips.map(function(c){
    return '<span class="chip" data-tipo="'+c.tipo+'">'+esc(c.txt)+' <span class="chip-x">✕</span></span>';
  }).join("");
  cont.querySelectorAll(".chip").forEach(function(ch){
    ch.addEventListener("click", function(){
      var t = this.getAttribute("data-tipo");
      if(t==="source"){ fSource="all"; document.getElementById("f-source").value="all"; }
      else if(t==="coin"){ fCoin="all"; document.getElementById("f-coin").value="all"; }
      else if(t==="tema"){ fTema=null; }
      else if(t==="hot"){ fMulti=false; document.getElementById("f-multi").classList.remove("on"); }
      else if(t==="q"){ q=""; document.getElementById("search").value=""; }
      visibleCount=30; render();
    });
  });
}

function render(){
  updateSourceFilter();
  renderChips();
  var list = document.getElementById("list");
  list.classList.toggle("hot-mode", fMulti);
  var arrFull = items.filter(function(it){
    if(q && it.title.toLowerCase().indexOf(q.toLowerCase())<0) return false;
    if(fSource!=="all" && it.source!==fSource) return false;
    if(fCoin!=="all" && it.coins.indexOf(fCoin)<0) return false;
    if(fMulti && !esCaliente(it)) return false;
    if(fTema && it.tema !== fTema) return false;
    return true;
  }).sort(function(a,b){
    // Modo Calientes: manda la importancia pura (urgencia).
    if(fMulti) return b.urgencia - a.urgencia;
    // Feed normal: manda la frescura efectiva (las importantes envejecen lento,
    // así lo crítico se mantiene arriba sin tapar el flujo en vivo).
    return frescura(b) - frescura(a);
  });

  // En modo Calientes: si varias noticias son del mismo tema (la misma historia
  // cubierta por varios medios), dejamos SOLO una (la de mayor urgencia, que ya
  // quedó primera por el sort). Así no se duplica la misma noticia como caliente.
  if(fMulti){
    var vistos = {};
    arrFull = arrFull.filter(function(it){
      var clave = it.tema || it.id;   // sin tema, cada una es única
      if(vistos[clave]) return false;
      vistos[clave] = true;
      return true;
    });
  }

  // Separo: frescas (barra > umbral) se ven siempre; archivadas (barra ≤ umbral)
  // solo cuando el usuario toca "Archivo". En modo Calientes / con búsqueda no archivo.
  var sinArchivar = (fMulti || q || fTema || fSource!=="all" || fCoin!=="all");
  var frescas = [], archivadas = [];
  arrFull.forEach(function(it){
    if(!sinArchivar && frescura(it) <= UMBRAL_ARCHIVO) archivadas.push(it);
    else frescas.push(it);
  });
  // Lo que se muestra: las frescas, y si tocaron "Archivo", también las archivadas debajo.
  var visibles = verArchivo ? frescas.concat(archivadas) : frescas;
  var arr = visibles.slice(0, visibleCount);

  if(arr.length===0){
    list.innerHTML = '<div class="empty">'+(items.length?'No hay noticias que coincidan con el filtro.':'Cargando noticias…')+'</div>';
    return;
  }

  var html = "";
  for(var i=0;i<arr.length;i++){
    var it = arr[i];
    var hot = esCaliente(it);
    var isOpen = expandedId === it.id;
    var coinsHtml = it.coins.slice(0,3).map(function(c){ return '<span class="row-coin">'+c+'</span>'; }).join("");
    var temaHtml = (it.tema && it.fuentes_tema >= 2)
      ? '<span class="row-tema tema-click" data-tema="'+esc(it.tema)+'" title="Ver todas las de este tema">'+esc(it.tema)+' · '+it.fuentes_tema+' fuentes</span>'
      : (it.tema ? '<span class="row-tema">'+esc(it.tema)+'</span>' : "");
    var panel = "";
    if(isOpen){
      panel = panelHtml(it);
    }
    // Cebra: dos pares de tonos según renglón (par/impar). Sin gradiente.
    // El fondo de la fila es el tono "resto" (oscuro). La franja de vejez es una
    // capa sólida (tono "barra") encima, con ancho = frescura, animable al cargar.
    var fresc = frescura(it);
    var barra, resto;
    if(fMulti){
      // Modo caliente: una fila rojiza, la otra naranja oscuro (con buena diferencia).
      if(i % 2 === 0){ barra = "#3a1006"; resto = "#180603"; } // rojizo
      else           { barra = "#44260a"; resto = "#221405"; } // naranja oscuro (más separado)
    } else {
      // Normal: 4 tonos de gris (los que definió Javi). barra = franja de vejez, resto = fondo.
      if(i % 2 === 0){ barra = "#1b1b1b"; resto = "#000000"; } // línea 1
      else           { barra = "#0d0d0d"; resto = "#000000"; } // línea 2
    }
    var corte = Math.max(0, Math.min(98, fresc));
    // Ícono de sentimiento (lo genera el motor): toro=alcista, oso=bajista, nada=neutral.
    var sentHtml = "";
    if(it.sentimiento === "bull") sentHtml = '<img class="ico-sent bull" src="ico-toro.png" alt="Alcista" title="Alcista">';
    else if(it.sentimiento === "bear") sentHtml = '<img class="ico-sent bear" src="ico-oso.png" alt="Bajista" title="Bajista">';
    html += '<div class="news-row'+(isOpen?' open':'')+(it.esNueva?' nueva':'')+'" data-id="'+esc(it.id)+'" style="background:'+resto+'">'
      + '<div class="franja'+(animarFranjas?' anim':'')+'" style="width:'+corte+'%;background:'+barra+';--w:'+corte+'%"></div>'
      + '<div class="news-row-main">'
      + sentHtml
      + '<div style="flex:1">'
      + '<div class="row-head">'
      + '<span class="row-src">'+esc(it.source)+'</span>'
      + '<span class="row-time">'+timeAgo(it.ts)+'</span>'
      + (hot?'<span class="hot-tag"><span class="flama">🔥</span> caliente</span>':'')
      + (it.evento_cerca?'<span class="evento-tag">📅 dato clave</span>':'')
      + temaHtml
      + coinsHtml
      + '</div>'
      + '<div class="news-title">'+esc(clip(it.title))+'</div>'
      + '</div>'
      + '<span class="row-open">'+(isOpen?'▾':'<img class="ico-go" src="ico-flecha.png" alt="ir">')+'</span>'
      + '</div>'
      + panel
      + '</div>';
  }
  // Botón inferior: si hay más visibles que el tope, pagina ("Cargar más").
  // Si ya se ven todas las frescas y hay archivadas ocultas, ofrece "Archivo".
  if(visibles.length > visibleCount){
    html += '<button id="load-more" class="load-more">Cargar más ↓</button>';
  } else if(!verArchivo && archivadas.length > 0){
    html += '<button id="ver-archivo" class="load-more">📁 Archivo · '+archivadas.length+' noticias anteriores</button>';
  }
  list.innerHTML = html;
  animarFranjas = false; // ya se animó (si correspondía); los renders de reloj no animan

  var rows = list.querySelectorAll(".news-row");
  for(var k=0;k<rows.length;k++){
    (function(rowMain){
      rowMain.addEventListener("click", function(){
        toggleRow(rowMain.parentNode.getAttribute("data-id"));
      });
    })(rows[k].querySelector(".news-row-main"));
  }
  // Clic en la etiqueta de tema → filtra por ese tema (sin desplegar la noticia)
  list.querySelectorAll(".tema-click").forEach(function(t){
    t.addEventListener("click", function(e){
      e.stopPropagation();
      fTema = this.getAttribute("data-tema");
      visibleCount = 30;
      render();
    });
  });
  var moreBtn = document.getElementById("load-more");
  if(moreBtn){
    moreBtn.addEventListener("click", function(){ visibleCount += 20; render(); });
  }
  var archBtn = document.getElementById("ver-archivo");
  if(archBtn){
    archBtn.addEventListener("click", function(){ verArchivo = true; render(); });
  }
}

// Arma el HTML del panel desplegable de una noticia.
function panelHtml(it){
  var resumenHtml = it.resumen ? '<p class="news-resumen">'+esc(it.resumen)+'</p>' : '';
  var origHtml = it.original ? '<p class="news-orig">Original: '+esc(it.original)+'</p>' : '';
  // 3 key points (si el motor los generó)
  var puntosHtml = "";
  if(it.puntos && it.puntos.length){
    puntosHtml = '<ul class="news-puntos">'
      + it.puntos.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join("")
      + '</ul>';
  }
  // En modo caliente, el botón leer usa colores de fuego y la flecha caliente.
  var flechaBtn = fMulti ? "ico-flecha-caliente.png" : "ico-flecha.png";
  var btnClase = fMulti ? "read-btn hot" : "read-btn";
  return '<div class="news-panel">'
    + puntosHtml
    + resumenHtml
    + origHtml
    + (it.url ? '<a class="'+btnClase+'" href="'+esc(it.url)+'" target="_blank" rel="noopener noreferrer">Leer en '+esc(it.source)+' <img class="ico-go-sm" src="'+flechaBtn+'" alt=""></a>' : '')
    + '</div>';
}

// Despliega/pliega SOLO la fila tocada, sin reconstruir la lista entera.
// Así el scroll nunca se mueve y no hay saltos (importante dentro del iframe de Wix).
function toggleRow(id){
  var row = document.querySelector('.news-row[data-id="'+(window.CSS && CSS.escape ? CSS.escape(id) : id)+'"]');
  if(!row){ expandedId = (expandedId === id) ? null : id; render(); return; }
  var abrir = expandedId !== id;

  // Cerrar la que estuviera abierta (si es otra)
  if(expandedId && expandedId !== id){
    var prev = document.querySelector('.news-row.open');
    if(prev){
      prev.classList.remove("open");
      var pIcon = prev.querySelector(".row-open");
      if(pIcon) pIcon.innerHTML = '<img class="ico-go" src="ico-flecha.png" alt="ir">';
      var pPanel = prev.querySelector(".news-panel");
      if(pPanel) pPanel.remove();
    }
  }

  var icon = row.querySelector(".row-open");
  if(abrir){
    expandedId = id;
    row.classList.add("open");
    if(icon) icon.innerHTML = "▾";
    var it = items.find(function(x){ return x.id === id; });
    if(it){ row.insertAdjacentHTML("beforeend", panelHtml(it)); }
  } else {
    expandedId = null;
    row.classList.remove("open");
    if(icon) icon.innerHTML = '<img class="ico-go" src="ico-flecha.png" alt="ir">';
    var panel = row.querySelector(".news-panel");
    if(panel) panel.remove();
  }
}

(function(){
  var sel = document.getElementById("f-coin");
  COINS.forEach(function(c){ var o=document.createElement("option"); o.value=c; o.textContent=c; sel.appendChild(o); });
})();

document.getElementById("search").addEventListener("input", function(e){ q=e.target.value; visibleCount=30; render(); });
document.getElementById("f-source").addEventListener("change", function(e){ fSource=e.target.value; visibleCount=30; render(); });
document.getElementById("f-coin").addEventListener("change", function(e){ fCoin=e.target.value; visibleCount=30; render(); });
document.getElementById("f-multi").addEventListener("click", function(){
  fMulti = !fMulti;
  this.classList.toggle("on", fMulti);
  visibleCount=30; render();
});

// Botón refrescar: recarga las noticias y busca si hay versión nueva de la app.
document.getElementById("btn-refrescar").addEventListener("click", function(){
  var b = this;
  b.classList.remove("girando"); void b.offsetWidth; b.classList.add("girando");
  animarFranjas = true;
  loadNews();
  if("serviceWorker" in navigator){
    navigator.serviceWorker.getRegistration().then(function(reg){ if(reg) reg.update(); });
  }
});

// En mobile arrancamos con bastantes noticias. Con pocas, al desplegar una el
// contenedor queda justo en el límite de su altura y iOS traba el scroll.
// Con contenido de sobra, el scroll siempre funciona bien.
/* mobile y desktop arrancan en 30 */

setInterval(render, 30000);
pollTimer = setInterval(loadNews, 120000);

loadNews();

// Registrar el service worker (habilita instalar Pulso como app)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      // Buscar actualización al abrir
      reg.update();
      // Si aparece un SW nuevo, cuando esté listo recargamos para mostrar la versión fresca.
      reg.addEventListener("updatefound", function(){
        var nuevo = reg.installing;
        if(!nuevo) return;
        nuevo.addEventListener("statechange", function(){
          if(nuevo.state === "installed" && navigator.serviceWorker.controller){
            // Hay una versión nueva lista → activarla y recargar una vez.
            nuevo.postMessage && nuevo.postMessage("skip-waiting");
            window.location.reload();
          }
        });
      });
    }).catch(function(){});
    // Al volver a la app (cambiar de pestaña/volver), chequear actualización.
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden){
        navigator.serviceWorker.getRegistration().then(function(reg){ if(reg) reg.update(); });
      }
    });
  });
}

// ── Banner de instalación ─────────────────────────────────────────────────────
(function(){
  var banner = document.getElementById("install-banner");
  if(!banner) return;
  var sub = document.getElementById("ib-sub");
  var action = document.getElementById("ib-action");
  var closeBtn = document.getElementById("ib-close");
  var modal = document.getElementById("install-modal");
  var modalClose = document.getElementById("im-close");
  var deferredPrompt = null;
  var mostrado = false;

  // ¿Ya está instalada? (corre en modo standalone) → no mostrar nada.
  var yaInstalada = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  // ¿Ya lo cerró antes? (lo recordamos)
  var yaCerrado = false;
  try { yaCerrado = localStorage.getItem("pulso-install-cerrado") === "1"; } catch(e){}

  var esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPad moderno
  // En iOS, solo Safari puede "Agregar a inicio". Chrome/Firefox/otros NO pueden.
  // Detectamos si NO es Safari (los otros navegadores en iOS tienen CriOS, FxiOS, etc. en el user agent).
  var ua = navigator.userAgent;
  var esSafariIOS = esIOS && /safari/i.test(ua) && !/crios|fxios|edgios|opios|brave/i.test(ua);
  var esOtroNavegadorIOS = esIOS && !esSafariIOS;

  // Android nos da este evento: permite instalar con un botón.
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredPrompt = e;
  });

  // Prepara el contenido del popup para "abrí en Safari" (Chrome/otros en iOS)
  function ponerContenidoSafari(){
    document.getElementById("im-title").textContent = "Abrí Pulso en Safari";
    document.getElementById("im-content").innerHTML =
      '<p style="color:#d8e6e0;font-size:15px;line-height:1.6;margin-bottom:8px;">'
      + 'Para instalar Pulso necesitás abrir esta página en <b style="color:#00ff00">Safari</b> '
      + '(es la única forma en iPhone).</p>'
      + '<p style="color:#9bb5ac;font-size:13px;line-height:1.6;">'
      + 'Copiá el enlace y pegalo en Safari, o tocá el menú de tu navegador y elegí '
      + '“Abrir en Safari”. Después vas a poder agregarlo a tu pantalla de inicio.</p>';
  }

  function mostrar(){
    if(mostrado || yaInstalada || yaCerrado) return;
    mostrado = true;
    // SIEMPRE arrancamos con ambos ocultos, y mostramos UNO solo.
    banner.hidden = true;
    modal.hidden = true;

    if(esIOS && esSafariIOS){
      // Safari en iPhone: SOLO popup con instrucciones.
      modal.hidden = false;
      return;
    }
    if(esIOS && !esSafariIOS){
      // Chrome/Firefox/etc en iOS: SOLO banner discreto. Al tocarlo, popup "abrí en Safari".
      banner.classList.add("ios");
      sub.textContent = "Agregalo a tu pantalla de inicio";
      action.textContent = "Ver cómo";
      banner.hidden = false;
      return;
    }
    // No es iOS (Android/desktop):
    if(!deferredPrompt){ mostrado = false; return; } // no hay forma de instalar → no molestar
    banner.classList.remove("ios");
    sub.textContent = "Tenelo siempre a mano en tu teléfono";
    action.textContent = "Instalar";
    banner.hidden = false;
  }

  // Botón de acción del banner
  action.addEventListener("click", function(){
    if(esOtroNavegadorIOS){
      // Abre el popup con el mensaje de "abrí en Safari"
      ponerContenidoSafari();
      modal.hidden = false;
    } else if(deferredPrompt){
      // Android: instala directo
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){ deferredPrompt = null; ocultar(true); });
    }
  });

  // Cerrar el popup (y queda cerrado para no insistir)
  function cerrarModal(){ modal.hidden = true; ocultar(true); }
  modalClose.addEventListener("click", cerrarModal);
  modal.addEventListener("click", function(e){ if(e.target === modal) cerrarModal(); });

  function ocultar(permanente){
    banner.hidden = true;
    modal.hidden = true;
    if(permanente){ try { localStorage.setItem("pulso-install-cerrado","1"); } catch(e){} }
  }
  closeBtn.addEventListener("click", function(){ ocultar(true); });

  if(!yaInstalada && !yaCerrado){
    // Aparece tras 25s, o al scrollear un poco (lo que pase primero).
    var timer = setTimeout(mostrar, 25000);
    var appEl = document.getElementById("app");
    if(appEl){
      var onScroll = function(){
        if(appEl.scrollTop > 600){ clearTimeout(timer); mostrar(); appEl.removeEventListener("scroll", onScroll); }
      };
      appEl.addEventListener("scroll", onScroll, { passive: true });
    }
  }
})();
</script>
